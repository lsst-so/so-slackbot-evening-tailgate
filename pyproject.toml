[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "so-slackbot-evening-tailgate"
dynamic = ["version"]
description = "Slack bot that coordinates Vera Rubin Observatory's daily Evening Tailgate Meeting."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "slack-bolt>=1.19,<2",
    "APScheduler>=3.10,<4",
    # zoneinfo needs a tz database; slim container images don't ship one.
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# Tools for cutting a release: see RELEASE.md.
dev = ["scriv[toml]>=1.5", "setuptools-scm>=8"]

[project.scripts]
tailgate-bot = "tailgate_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

# Version is derived from the most recent Git tag (e.g. tag "v0.1.0" -> version
# "0.1.0"; commits after a tag get a ".devN+g<sha>" suffix). fallback_version
# keeps `pip install .` working where there is no Git history -- notably the
# Docker image build, which excludes .git. The published image is still
# identified by its registry tag (set from the Git tag by
# .github/workflows/docker.yaml); only the in-image `tailgate_bot.__version__`
# falls back, and nothing at runtime reads it.
[tool.setuptools_scm]
fallback_version = "0.0.0"

# scriv assembles CHANGELOG.md from the news fragments in changelog.d/ at
# release time. See RELEASE.md.
[tool.scriv]
categories = [
    "Backwards-incompatible changes",
    "New features",
    "Bug fixes",
    "Other changes",
]
entry_title_template = "{{ version }} ({{ date.strftime('%Y-%m-%d') }})"
format = "md"
md_header_level = "2"
new_fragment_template = "file: changelog.d/_template.md.jinja"

# Pytest configuration required to prevent pytest from looking for
# configurations in parent directories.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
